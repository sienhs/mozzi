# 사람이 보기 위한 한국어 라벨 (export_prompts.py 가 captions_ko.md 를 만들 때만 사용)
# 학습·생성에는 쓰지 않는다. 실제 캡션·프롬프트는 prompt_rules.yaml 이 정의한다.

moods:
  happy: 행복
  calm: 평온
  neutral: 기본
