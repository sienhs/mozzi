# Tests get their database from Testcontainers (see support/PostgresTestContainer), which
# supplies the connection details through @ServiceConnection. No datasource is configured
# here on purpose — a hardcoded URL would let a test run against a developer's local database
# and leave rows behind in it.
spring:
  application:
    name: mozzi-test

mozzi:
  auth:
    jwt-secret: test-only-jwt-secret-of-at-least-32-bytes
  google:
    # Google itself is never called from tests; GoogleIdTokenVerifier is replaced or fed a
    # local key set.
    client-ids: test-web-client-id
  gms:
    # GMS itself is never called from tests; its clients are mocked or run against
    # MockRestServiceServer. Saving a diary still triggers an embedding refresh in the
    # background, so the address points at a closed local port: the call fails at once and
    # the refresh is logged as deferred, instead of sending test data to GMS.
    base-url: http://127.0.0.1:9/v1
    api-key: test-gms-key
  search:
    # Off: a sweep firing mid-test would write rows a test did not expect.
    embedding-sweep-cron: "-"
  image:
    # Picture inputs go out untranslated: GMS is never called from tests, and a translation
    # failing in the background would flip a picture a test expects to stay PENDING.
    translate: false
  gacha:
    # Off: tests insert their own cards (GachaFixtures) and count on the table holding only those.
    seed-cards: false
