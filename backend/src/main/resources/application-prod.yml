spring:
  datasource:
    # No defaults on purpose: a missing value must stop the server, not silently point it
    # at a developer database.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

logging:
  level:
    # Keep this at INFO. DEBUG on com.ssafy.mozzi prints bound request objects, which for
    # this service means diary text and Google id tokens land in the log store.
    com.ssafy.mozzi: INFO
  structured:
    format:
      # One JSON object per line on stdout, which is what the k3s log collector reads.
      console: ecs
