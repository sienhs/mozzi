# Developer PC. The database comes from backend/compose.yaml:
#   cd backend && docker compose up -d
#
# Error messages are shown to make API debugging easier. These only affect Spring's own
# fallback error page; API errors always come from GlobalExceptionHandler, which never
# echoes a payload on any profile.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mozzi}
    username: ${DB_USERNAME:mozzi}
    password: ${DB_PASSWORD:mozzi}
  jpa:
    show-sql: false

mozzi:
  auth:
    # A fixed key so a local server starts without setup. Tokens it signs are worthless
    # anywhere else; the prod profile has no default.
    jwt-secret: ${AUTH_JWT_SECRET:local-only-jwt-secret-not-for-any-real-server}
  google:
    # Google login only works locally once this is set to the real Web client id.
    client-ids: ${GOOGLE_CLIENT_IDS:local-google-client-id-not-set}
  gms:
    # The server starts without a key; emotion search answers 503 until GMS_API_KEY is set.
    api-key: ${GMS_API_KEY:local-gms-key-not-set}

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

logging:
  level:
    com.ssafy.mozzi: DEBUG
