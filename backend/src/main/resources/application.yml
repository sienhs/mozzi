# Common settings shared by every profile.
# Profiles: local (developer PC), prod (production server).
# A packaged jar refuses to start unless exactly one of them is set via
# SPRING_PROFILES_ACTIVE or --spring.profiles.active. IDE runs and bootRun fall back to local.
spring:
  application:
    name: mozzi
  profiles:
    default: local
  datasource:
    hikari:
      # Hikari's 30s default makes the readiness probe hang instead of answering when the
      # database is unreachable: the probe holds a request thread for half a minute and
      # Kubernetes records a timeout rather than a 503 (verified by stopping the container).
      # Getting a connection from a healthy pool takes under a millisecond, so 3s only ever
      # trips when something is actually wrong.
      connection-timeout: 3000
      validation-timeout: 2000
  jpa:
    hibernate:
      # Flyway owns the schema. 'update' would let Hibernate and Flyway both change it, and
      # Hibernate cannot express what the migrations need anyway (partial unique indexes,
      # comments). 'validate' instead turns a drifted entity into a startup failure.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Refuse to start when a migration file has been edited after it ran. The alternative is
    # a database whose schema no longer matches the files in git, on one machine only.
    validate-on-migrate: true
  jackson:
    # Spec 1.1 keeps keys the client branches on present even when empty
    # ("todayDiary": null, "nextCursor": null), so nulls must not be dropped.
    default-property-inclusion: always
    # Spec 1: timestamps carry the Asia/Seoul offset (2026-10-22T21:12:00+09:00).
    # Without this Jackson normalises an OffsetDateTime to the mapper's zone, which
    # defaults to UTC and would render the same instant as ...T12:12:00Z.
    time-zone: Asia/Seoul
    datatype:
      datetime:
        # Jackson 3 moved WRITE_DATES_AS_TIMESTAMPS out of SerializationFeature into
        # DateTimeFeature, so this has to sit under datatype.datetime. The Boot 2/3 key
        # spring.jackson.serialization.write-dates-as-timestamps now fails startup with a
        # ConversionFailedException (verified), so a copied snippet breaks loudly, not
        # silently. Dates must be ISO-8601 strings, never epoch numbers.
        write-dates-as-timestamps: false
    deserialization:
      # A misspelled request field is a client bug; answering 400 surfaces it immediately
      # instead of silently applying a default.
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      # The project returns the error body from spec 1.2, not RFC 9457 ProblemDetail.
      # Leaving this on would produce two different error shapes depending on which layer
      # rejected the request.
      enabled: false

mozzi:
  auth:
    issuer: mozzi
    audience: mozzi-app
    # HS256 key of at least 32 bytes, e.g. `openssl rand -base64 48`. Comes from a Secret; a
    # missing value stops the server instead of signing with something guessable.
    jwt-secret: ${AUTH_JWT_SECRET}
    access-token-ttl: 30m
    # Counted again from every refresh, so an app in use stays signed in.
    refresh-token-ttl: 30d
    signup-ticket-ttl: 10m
  google:
    # The server's Web client id that the Android app requests its ID token for.
    # Comma-separated if more than one is accepted.
    client-ids: ${GOOGLE_CLIENT_IDS}
    jwks-uri: https://www.googleapis.com/oauth2/v3/certs
  gms:
    # SSAFY GMS, an OpenAI-compatible proxy. Emotion search uses it for both the chat model
    # and the embeddings (docs/api/emotion-search.md); picture requests use it to translate
    # their inputs. One key and one connection for both.
    base-url: https://gms.ssafy.io/gmsapi/api.openai.com/v1
    # Comes from a Secret; prod has no default.
    api-key: ${GMS_API_KEY}
    chat-model: gpt-6-luna
    # Picture inputs to English (Chat Completions). Chosen by comparing ten GMS models on
    # diary inputs: the only one with no mistranslation that was also among the cheapest.
    translation-model: gpt-4.1-mini
    reasoning-effort: none
    max-output-tokens: 1000
    embedding-model: text-embedding-3-large
    # Must match diary_embedding.embedding (vector(1536)). Changing either one means a new
    # migration and re-embedding every diary.
    embedding-dimensions: 1536
    connect-timeout: 2s
    read-timeout: 5s
  search:
    # One question end to end (spec: 10 seconds). Past it the question answers 503.
    time-budget: 10s
    # Catches up on diary embeddings the change events missed (DiaryEmbeddingSweeper).
    embedding-sweep-cron: "0 */5 * * * *"
  terms:
    # The version the app must show and send for each required document at sign-up.
    current-versions:
      TERMS: "1.0"
      PRIVACY: "1.0"
  app:
    # GET /meta. Below the minimum the app blocks itself and sends the member to the store;
    # below the latest it only offers the update.
    min-supported-version: ${MOZZI_APP_MIN_SUPPORTED_VERSION:1.0.0}
    latest-version: ${MOZZI_APP_LATEST_VERSION:1.0.0}
  image:
    # Until the character table exists every picture uses this character. Optional: without
    # an image URL, requests carry characterImageUrl "DEFAULT" and the server still starts.
    default-character-image-url: ${MOZZI_DEFAULT_CHARACTER_IMAGE_URL:}
    # In English and sent as is; it is the same for every picture, so it is not translated.
    default-character-prompt: ${MOZZI_DEFAULT_CHARACTER_PROMPT:a white round mochi rice cake with pink cheeks and short arms and legs}
    # Translate picture inputs with GMS (mozzi.gms.translation-model). Off locally and in
    # tests, where there is no real key: inputs then go out in Korean.
    translate: true
  ai-queue:
    # Blank outside prod: requests are only logged and no result is consumed. prod requires both.
    request-url: ${SQS_AI_REQUEST_QUEUE_URL:}
    response-url: ${SQS_AI_RESPONSE_QUEUE_URL:}
    region: ${AWS_REGION:ap-northeast-2}
  fcm:
    # The Firebase service account key file's content, as JSON or Base64. Blank: pushes are only
    # logged, and the app finds picture results when it opens the diary.
    service-account-key: ${FIREBASE_SA_KEY:}

springdoc:
  # Only our API. Actuator is left out; its endpoints are not part of the spec.
  paths-to-match: /api/**
  # Shows a @ModelAttribute search object (DiarySearchRequestDto) as its separate query
  # parameters, which is how the client actually sends it.
  default-flat-param-object: true
  # Every API speaks JSON; springdoc's default would list responses as */*.
  default-produces-media-type: application/json
  swagger-ui:
    # Keeps the pasted access token across page reloads while testing.
    persist-authorization: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        # Kubernetes needs liveness and readiness separately: a dependency that is only
        # needed to serve traffic must fail readiness, not restart the pod.
        enabled: true
      group:
        liveness:
          # Process health only. Putting the database here would restart every pod during a
          # database blip, which fixes nothing and loses the in-flight requests.
          include: livenessState
        readiness:
          # Every endpoint in the spec needs the database, so a pod that cannot reach it has
          # nothing useful to serve and should be taken out of the Service.
          # Trade-off: a database outage empties the Service of endpoints, so clients get a
          # connection error instead of a 500. If that is the wrong call for an incident,
          # drop 'db' here rather than disabling the probe.
          #
          # Measured with the database stopped: liveness answers 200 in 9ms, readiness
          # answers 503 after ~3s (bounded by the Hikari connection-timeout above). The
          # Deployment manifest therefore needs readinessProbe.timeoutSeconds of 5 or more,
          # otherwise Kubernetes records a probe timeout instead of reading the 503.
          include: readinessState, db

logging:
  level:
    # On a malformed request line Tomcat logs the raw request target, query string and all,
    # at INFO — before any filter runs, so RequestLoggingFilter cannot keep it out (verified
    # by sending an unencoded character in a query parameter). Spec 4.2 puts a nickname in a
    # query string, so that line would put personal data in the log store. Malformed request
    # lines come from scanners and client bugs, so WARN loses nothing we would act on.
    org.apache.coyote.http11.Http11Processor: WARN
  structured:
    json:
      context:
        # Carries the MDC (traceId, memberId) into each JSON log line.
        include: true
