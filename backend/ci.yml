.backend-gradle:
  image: eclipse-temurin:17-jdk-jammy
  interruptible: true
  timeout: 15 minutes
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  cache:
    key:
      prefix: backend-gradle-jdk17
      files:
        - backend/gradle/wrapper/gradle-wrapper.properties
        - backend/build.gradle
    paths:
      - .gradle/caches/
      - .gradle/wrapper/
    policy: pull-push
  before_script:
    - cd "$CI_PROJECT_DIR/backend"
  rules:
    # Allow an explicit Run pipeline action to verify the backend at any time.
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
        - .editorconfig
        - .gitattributes

backend:test:
  extends: .backend-gradle
  stage: test
  script:
    # Invoke via sh so the checkout does not need an executable bit on gradlew.
    - sh ./gradlew --no-daemon --console=plain test
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: backend/build/test-results/test/TEST-*.xml
    paths:
      - backend/build/reports/tests/test/
