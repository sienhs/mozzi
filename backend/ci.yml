.backend-gradle:
  image: eclipse-temurin:17-jdk-jammy
  interruptible: true
  timeout: 15 minutes
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  cache:
    key:
      prefix: backend-gradle-jdk17
      files:
        - backend/gradle/wrapper/gradle-wrapper.properties
        - backend/build.gradle
    paths:
      - .gradle/caches/
      - .gradle/wrapper/
    policy: pull-push
  before_script:
    - cd "$CI_PROJECT_DIR/backend"
  rules:
    # Allow an explicit Run pipeline action to verify the backend at any time.
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - docs/legal/TERMS.md
        - docs/legal/PRIVACY.md
        - .editorconfig
        - .gitattributes

backend:test:
  extends: .backend-gradle
  stage: test
  # Tests start a PostgreSQL container through Testcontainers, so the job needs a Docker
  # daemon of its own. The alternative -- a GitLab `services: postgres` plus a separate CI
  # profile -- would mean local and CI verify the migrations through two different paths.
  services:
    - name: docker:27.5.1-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # Containers run inside the dind service, so their published ports are reachable at the
    # service alias rather than at localhost.
    TESTCONTAINERS_HOST_OVERRIDE: docker
    # Ryuk cleans up leftover containers; a CI job is thrown away anyway, and it needs a
    # socket mount that dind does not offer.
    TESTCONTAINERS_RYUK_DISABLED: "true"
  script:
    # Invoke via sh so the checkout does not need an executable bit on gradlew.
    # `check` runs test + spotlessCheck, so formatting drift fails the pipeline.
    - sh ./gradlew --no-daemon --console=plain check
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: backend/build/test-results/test/TEST-*.xml
    paths:
      - backend/build/reports/tests/test/

.backend-release:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $INFRA_ACTION != "ansible" && $INFRA_ACTION != "terraform"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - backend/**/*
        - docs/legal/TERMS.md
        - docs/legal/PRIVACY.md
        - infra/k8s/backend/**/*

backend:package:
  extends: .backend-gradle
  stage: build
  rules: !reference [.backend-release, rules]
  script:
    - sh ./gradlew --no-daemon --console=plain bootJar
  artifacts:
    expire_in: 1 day
    paths:
      - backend/build/libs/app.jar

backend:publish:
  image: docker:27.5.1-cli
  stage: publish
  resource_group: backend-ecr-publish
  timeout: 15 minutes
  services:
    - name: docker:27.5.1-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    AWS_DEFAULT_REGION: ap-northeast-2
    AWS_PAGER: ""
  needs:
    - job: backend:package
      artifacts: true
  rules: !reference [.backend-release, rules]
  before_script:
    - apk add --no-cache aws-cli
  script:
    - ': "${BACKEND_ECR_REPOSITORY_URL:?Set BACKEND_ECR_REPOSITORY_URL in GitLab CI/CD variables}"'
    - export BACKEND_IMAGE="${BACKEND_ECR_REPOSITORY_URL}:${CI_COMMIT_SHA}"
    # The Terraform repository is immutable; retrying a published commit is a no-op.
    - |
      if aws ecr describe-images --repository-name "${BACKEND_ECR_REPOSITORY_URL#*/}" \
        --image-ids "imageTag=${CI_COMMIT_SHA}" > /dev/null 2> ecr-error.txt; then
        echo "Image already published: ${BACKEND_IMAGE}"
      elif grep -q 'ImageNotFoundException' ecr-error.txt; then
        aws ecr get-login-password | docker login --username AWS --password-stdin "${BACKEND_ECR_REPOSITORY_URL%%/*}"
        docker build --pull -t "$BACKEND_IMAGE" backend
        docker push "$BACKEND_IMAGE"
      else
        cat ecr-error.txt >&2
        exit 1
      fi
    - printf 'BACKEND_IMAGE=%s\n' "$BACKEND_IMAGE" > backend-image.env
  artifacts:
    expire_in: 7 days
    reports:
      dotenv: backend-image.env

backend:deploy:
  image: alpine:3.21
  stage: deploy
  resource_group: backend-production
  timeout: 10 minutes
  needs:
    - job: backend:publish
      artifacts: true
    # If infrastructure is configured in this pipeline, wait for it first.
    - job: ansible:configure
      artifacts: false
      optional: true
  rules: !reference [.backend-release, rules]
  environment:
    name: production/backend
  variables:
    AWS_DEFAULT_REGION: ap-northeast-2
    AWS_PAGER: ""
  before_script:
    - apk add --no-cache aws-cli openssh-client gettext jq
    - ': "${SSAFY_HOST:?Set SSAFY_HOST}"'
    - ': "${SSAFY_SSH_KEY:?Set SSAFY_SSH_KEY as a GitLab File variable}"'
    - ': "${SSH_KNOWN_HOSTS:?Set SSH_KNOWN_HOSTS as a verified GitLab File variable}"'
    - ': "${BACKEND_IMAGE:?Missing image artifact from backend:publish}"'
    - ': "${BACKEND_ENV:?Set BACKEND_ENV as a GitLab File variable containing backend runtime KEY=value settings}"'
    - test -s "$BACKEND_ENV"
    - chmod 600 "$SSAFY_SSH_KEY"
  script:
    - |
      set -eu
      case "$SSAFY_HOST" in
        ''|*[!a-zA-Z0-9.-]*) echo 'Invalid SSAFY_HOST' >&2; exit 1 ;;
      esac
      remote_kubectl() {
        ssh -i "$SSAFY_SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS" \
          "ubuntu@$SSAFY_HOST" "sudo -n /usr/local/bin/k3s kubectl $*"
      }
      printf 'apiVersion: v1\nkind: Namespace\nmetadata:\n  name: mozzi\n' | remote_kubectl apply -f -

      # Keep the ECR token out of logs, command arguments and job artifacts.
      umask 077
      secret_dir=$(mktemp -d)
      trap 'rm -rf "$secret_dir"' EXIT
      # Parse the File variable on the cluster without copying it to a remote file.
      # Generate first so a parse/SSH failure stops deployment before applying the Secret.
      remote_kubectl create secret generic backend-env -n mozzi \
        --from-env-file=/dev/stdin --dry-run=client -o json \
        < "$BACKEND_ENV" > "$secret_dir/backend-env.json"
      remote_kubectl apply --server-side --field-manager=backend-ci -f - < "$secret_dir/backend-env.json"

      aws ecr get-authorization-token --output json > "$secret_dir/token.json"
      jq -e --arg registry "${BACKEND_IMAGE%%/*}" '
        .authorizationData[0].authorizationToken
        | select(type == "string" and length > 0)
        | {auths: {($registry): {auth: .}}}
        | tojson | @base64
        | {apiVersion: "v1", kind: "Secret",
           metadata: {name: "backend-ecr", namespace: "mozzi"},
           type: "kubernetes.io/dockerconfigjson",
           data: {".dockerconfigjson": .}}
      ' "$secret_dir/token.json" > "$secret_dir/secret.json"
      remote_kubectl apply --server-side --field-manager=backend-ci -f - < "$secret_dir/secret.json"

      # A new job ID rolls the Pods once, including when only BACKEND_ENV changed.
      envsubst '${BACKEND_IMAGE} ${CI_JOB_ID}' < infra/k8s/backend/deployment.yaml > "$secret_dir/deployment.yaml"
      remote_kubectl apply -f - < "$secret_dir/deployment.yaml"
      remote_kubectl apply -f - < infra/k8s/backend/service.yaml
      remote_kubectl rollout status deployment/backend -n mozzi --timeout=300s
      remote_kubectl apply -f - < infra/k8s/backend/ingress.yaml
      remote_kubectl get pods -n mozzi -l app=mozzi-backend -o wide
      remote_kubectl get ingress/backend -n mozzi
