apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mozzi
spec:
  replicas: 2
  minReadySeconds: 10
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: mozzi-backend
  template:
    metadata:
      annotations:
        infra.mozzi/deploy-job: "${CI_JOB_ID}"
      labels:
        app: mozzi-backend
    spec:
      nodeSelector:
        infra.mozzi/role: worker
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: backend-ecr
      terminationGracePeriodSeconds: 45
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: mozzi-backend
      containers:
        - name: backend
          image: ${BACKEND_IMAGE}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-env
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SERVER_PORT
              value: "8080"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70.0"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
