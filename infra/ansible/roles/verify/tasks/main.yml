---
- name: Wait for each expected node to become Ready
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - wait
      - '--for=condition=Ready'
      - 'node/{{ hostvars[item].k3s_node_name }}'
      - '--timeout=180s'
  loop: "{{ groups['k3s_server'] + groups['k3s_agents'] }}"
  changed_when: false

- name: Exercise cross-node DNS, Service and pod traffic
  block:
    - name: Write temporary smoke-test manifest
      ansible.builtin.copy:
        src: smoke.yaml
        dest: /run/mozzi-network-smoke.yaml
        mode: '0600'

    - name: Create isolated network checks
      ansible.builtin.command: /usr/local/bin/k3s kubectl apply -f /run/mozzi-network-smoke.yaml
      changed_when: true

    - name: Wait for HTTP endpoint on each worker
      ansible.builtin.command: /usr/local/bin/k3s kubectl rollout status daemonset/echo -n mozzi-network-check --timeout=180s
      changed_when: false

    - name: Confirm Traefik is available
      ansible.builtin.command: /usr/local/bin/k3s kubectl rollout status deployment/traefik -n kube-system --timeout=180s
      changed_when: false

    - name: Wait for DNS, ClusterIP and cross-node HTTP checks
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, patch, job/network, -n, mozzi-network-check, --type=merge, -p, '{"spec":{"suspend":false}}']
      changed_when: true

    - name: Await network smoke test completion
      ansible.builtin.command: /usr/local/bin/k3s kubectl wait --for=condition=complete job/network -n mozzi-network-check --timeout=180s
      changed_when: false
  always:
    - name: Remove temporary test namespace
      ansible.builtin.command: /usr/local/bin/k3s kubectl delete namespace mozzi-network-check --ignore-not-found --wait=false
      changed_when: true

    - name: Remove temporary test manifest
      ansible.builtin.file:
        path: /run/mozzi-network-smoke.yaml
        state: absent

- name: Show node inventory
  ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes -o wide
  register: cluster_nodes
  changed_when: false

- name: Report cluster nodes
  ansible.builtin.debug:
    msg: '{{ cluster_nodes.stdout_lines }}'
