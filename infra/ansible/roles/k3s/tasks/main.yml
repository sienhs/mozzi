---
- name: Determine node role
  ansible.builtin.set_fact:
    k3s_is_server: "{{ inventory_hostname in groups['k3s_server'] }}"
    k3s_service: "{{ 'k3s' if inventory_hostname in groups['k3s_server'] else 'k3s-agent' }}"

- name: Inspect existing installation
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: existing_k3s

- name: Inspect ownership marker
  ansible.builtin.stat:
    path: /etc/rancher/k3s/mozzi-managed
  register: managed_k3s

- name: Refuse to overwrite a cluster installed outside this playbook
  ansible.builtin.assert:
    that: not existing_k3s.stat.exists or managed_k3s.stat.exists
    fail_msg: Existing unmanaged k3s detected. Inspect and migrate it explicitly before running this playbook.

- name: Create Kubernetes configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0700'

- name: Write cluster configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: '0600'
  no_log: true
  diff: false
  notify: Restart k3s

- name: Create systemd drop-in directory
  ansible.builtin.file:
    path: '/etc/systemd/system/{{ k3s_service }}.service.d'
    state: directory
    mode: '0755'

- name: Start Kubernetes only after its VPN interface
  ansible.builtin.copy:
    dest: '/etc/systemd/system/{{ k3s_service }}.service.d/vpn.conf'
    mode: '0644'
    content: |
      [Unit]
      Requires=wg-quick@wg0.service
      After=wg-quick@wg0.service
  notify: Restart k3s

- name: Create static manifest directory on server
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    mode: '0755'
  when: k3s_is_server

- name: Place Traefik on SSAFY and limit ServiceLB to its labeled node
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
    mode: '0644'
    content: |
      apiVersion: helm.cattle.io/v1
      kind: HelmChartConfig
      metadata:
        name: traefik
        namespace: kube-system
      spec:
        valuesContent: |-
          nodeSelector:
            infra.mozzi/role: control-plane
  when: k3s_is_server

- name: Read currently installed version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: installed_version
  failed_when: false
  changed_when: false

- name: Download the official installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/src/install-k3s.sh
    mode: '0700'
  when: k3s_version not in installed_version.stdout

- name: Mark this configuration as managed before installation to allow recovery
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/mozzi-managed
    content: "Managed by infra/ansible; do not remove cluster data during retries.\n"
    mode: '0600'

- name: Install the pinned version without resetting cluster data
  ansible.builtin.command: /bin/sh /usr/local/src/install-k3s.sh
  environment:
    INSTALL_K3S_VERSION: '{{ k3s_version }}'
    INSTALL_K3S_EXEC: "{{ 'server' if k3s_is_server else 'agent' }}"
  when: k3s_version not in installed_version.stdout
  changed_when: true
  no_log: true

- name: Apply configuration changes before checking readiness
  ansible.builtin.meta: flush_handlers

- name: Ensure Kubernetes starts on boot
  ansible.builtin.systemd_service:
    name: '{{ k3s_service }}'
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the VPN-only API endpoint
  ansible.builtin.wait_for:
    host: "{{ hostvars['ssafy'].vpn_ip }}"
    port: 6443
    timeout: 180

- name: Wait for server readiness
  ansible.builtin.command: /usr/local/bin/k3s kubectl get --raw=/readyz
  register: api_readiness
  changed_when: false
  retries: 30
  delay: 5
  until: api_readiness.rc == 0
  when: k3s_is_server

- name: Read generated server join token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_join_token
  no_log: true
  when: k3s_is_server
