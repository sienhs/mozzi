.terraform:
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  timeout: 10 minutes
  variables:
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"
    # Preserve the existing ECR state; all infrastructure shares this state.
    TF_STATE_NAME: "bootstrap"
  before_script:
    - cd "$CI_PROJECT_DIR/infra/terraform"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - infra/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - infra/**/*

.terraform-deploy:
  extends: .terraform
  resource_group: terraform-bootstrap
  before_script:
    - !reference [.terraform, before_script]
    # Use each job's current token; never embed credentials in a saved plan.
    - export TF_HTTP_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
    - export TF_HTTP_LOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
    - export TF_HTTP_UNLOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
    - export TF_HTTP_USERNAME="gitlab-ci-token"
    - export TF_HTTP_PASSWORD="${CI_JOB_TOKEN}"
    - export TF_HTTP_LOCK_METHOD="POST"
    - export TF_HTTP_UNLOCK_METHOD="DELETE"
    - export TF_HTTP_RETRY_WAIT_MIN="5"
    # One GitLab File variable supplies all non-secret deployment settings.
    - ': "${TFVARS:?Set TFVARS as a GitLab File variable using terraform.tfvars.example}"'
    - cp "$TFVARS" terraform.tfvars
    - terraform init -reconfigure
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - infra/**/*

terraform:validate:
  extends: .terraform
  stage: test
  script:
    - terraform fmt -check -recursive
    - terraform init -backend=false
    - terraform validate
    - terraform test

terraform:plan:
  extends: .terraform-deploy
  stage: test
  needs:
    - job: terraform:validate
      artifacts: false
  script:
    - terraform plan -lock-timeout=60s -out=terraform.tfplan
  artifacts:
    expire_in: 1 day
    paths:
      - infra/terraform/terraform.tfplan

terraform:apply:
  extends: .terraform-deploy
  stage: deploy
  needs:
    - job: terraform:plan
      artifacts: true
  script:
    - terraform apply -lock-timeout=60s terraform.tfplan
    - terraform output
